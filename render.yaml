services:
  - type: web
    name: lejio-fri-web
    env: node
    region: copenhagen
    plan: standard
    # Note: render-start.sh handles build if needed, so buildCommand is optional
    buildCommand: npm install --legacy-peer-deps --include=dev
    startCommand: bash render-start.sh
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: 5432
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSL
        value: 'true'

  - type: pserv
    name: lejio-fri-db
    ipAllowList: []
    plan: standard
    region: copenhagen
    postgresVersion: 15
